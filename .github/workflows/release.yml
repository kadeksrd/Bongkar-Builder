name: Build and Attach Release Zip

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Bongkar Builder Zip
        run: |
          mkdir -p build_staging/bongkar-builder
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.gitignore' \
                    --exclude='*.zip' \
                    --exclude='*.tar.gz' \
                    --exclude='*.rar' \
                    --exclude='node_modules' \
                    --exclude='vendor' \
                    ./ build_staging/bongkar-builder/
          
          cd build_staging
          zip -r ../bongkar-builder.zip bongkar-builder
          cd ..
          ls -lh bongkar-builder.zip

      - name: Select Release Notes
        run: |
          TAG="${{ github.ref_name }}"
          echo "Selecting release notes for tag: $TAG"
          if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            echo "Found tag-specific notes: RELEASE_NOTES_${TAG}.md"
            cp "RELEASE_NOTES_${TAG}.md" ACTIVE_RELEASE_NOTES.md
          elif [ -f "RELEASE_NOTES.md" ]; then
            echo "Using default RELEASE_NOTES.md"
            cp RELEASE_NOTES.md ACTIVE_RELEASE_NOTES.md
          else
            echo "No release notes found, creating fallback"
            echo "Release $TAG" > ACTIVE_RELEASE_NOTES.md
          fi
          head -n 5 ACTIVE_RELEASE_NOTES.md

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: bongkar-builder.zip
          body_path: ACTIVE_RELEASE_NOTES.md
          name: Bongkar Canvas Builder ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
